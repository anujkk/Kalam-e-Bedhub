<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>नई-नवेली ख़ुशामद है अपने शौहर से - कलाम-ए-बेढब</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function jumpToPage(inputElement) {
      let val = parseInt(inputElement.value, 10);
      if (!isNaN(val) && val >= 2 && val <= 101) {
        let formatted = String(val).padStart(3, '0');
        window.location.href = "page_" + formatted + ".html";
      } else {
        inputElement.value = 89;
      }
    }
  </script>
</head>
<body>
  <header class="book-nav">
    <div class="nav-container">
      <a class="nav-link" href="page_088.html">← पिछला</a>
      <a class="nav-link" href="index.html">☰ विषय-सूची</a>
      <div class="page-jump-container">
        <span>पृष्ठ</span>
        <input 
          type="number" 
          class="page-input" 
          value="89" 
          min="2" 
          max="101" 
          title="पृष्ठ संख्या लिखकर Enter दबाएँ"
          onkeydown="if(event.key === 'Enter') jumpToPage(this);" 
          onchange="jumpToPage(this);"
        />
        <span>/ 101</span>
      </div>
      <a class="nav-link" href="page_090.html">अगला →</a>
    </div>
  </header>

  <main class="page-container">
    
    <article class="page-sheet">
      <div class="content-area">
        <div class="page-number">८५</div>
        <div class="couplet-group"><div class="couplet"><div class="misra left">नई-नवेली ख़ुशामद है अपने शौहर से</div><div class="misra right">वह बीवी करती ख़ुशामद है जो पुरानी है</div></div><div class="couplet"><div class="misra left">मियाँ ज़ईफ़ी से चौकी पे चढ़ नहीं सकते</div><div class="misra right">ग़ज़ब की ब्योनी पर चढ़ती हुई जवानी है</div></div><div class="couplet"><div class="misra left">बहार में हमें बेढब बहार मिल न सकी</div><div class="misra right">कि दौर-ए-मय के एवज़ दौर-ए-चाए-पानी है</div></div></div><hr class="divider">
      </div>
      
    </article>
    
  </main>
</body>
</html>
