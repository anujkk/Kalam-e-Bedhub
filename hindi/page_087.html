<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>लुत्फ़-ए-जन्नत का नमूना याँ दिखाने के लिए - कलाम-ए-बेढब</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function jumpToPage(inputElement) {
      let val = parseInt(inputElement.value, 10);
      if (!isNaN(val) && val >= 2 && val <= 101) {
        let formatted = String(val).padStart(3, '0');
        window.location.href = "page_" + formatted + ".html";
      } else {
        inputElement.value = 87;
      }
    }
  </script>
</head>
<body>
  <header class="book-nav">
    <div class="nav-container">
      <a class="nav-link" href="page_086.html">← पिछला</a>
      <a class="nav-link" href="index.html">☰ विषय-सूची</a>
      <div class="page-jump-container">
        <span>पृष्ठ</span>
        <input 
          type="number" 
          class="page-input" 
          value="87" 
          min="2" 
          max="101" 
          title="पृष्ठ संख्या लिखकर Enter दबाएँ"
          onkeydown="if(event.key === 'Enter') jumpToPage(this);" 
          onchange="jumpToPage(this);"
        />
        <span>/ 101</span>
      </div>
      <a class="nav-link" href="page_088.html">अगला →</a>
    </div>
  </header>

  <main class="page-container">
    
    <article class="page-sheet">
      <div class="content-area">
        <div class="page-number">८३</div>
        <div class="couplet-group"><div class="couplet"><div class="misra left">लुत्फ़-ए-जन्नत का नमूना याँ दिखाने के लिए</div><div class="misra right">हूर तो उन को बनाया मुझ को ग़िल्माँ कर दिया</div></div><div class="couplet"><div class="misra left">कामयाबी तब हुई जब हम ने राह-ए-इश्क़ में</div><div class="misra right">दीन सदक़े कर दिया ईमान क़ुर्बां कर दिया</div></div><div class="couplet"><div class="misra left">देख कर हालत तुम्हारी लोग करते हैं रिमार्क</div><div class="misra right">इक वली के घर में पैदा हक़ ने शैताँ कर दिया</div></div></div><hr class="divider">
      </div>
      
    </article>
