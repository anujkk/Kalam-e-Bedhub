<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>इंतिसाब - कलाम-ए-बेढब</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function jumpToPage(inputElement) {
      let val = parseInt(inputElement.value, 10);
      if (!isNaN(val) && val >= 2 && val <= 101) {
        let formatted = String(val).padStart(3, '0');
        window.location.href = "page_" + formatted + ".html";
      } else {
        inputElement.value = 5;
      }
    }
  </script>
</head>
<body>
  <header class="book-nav">
    <div class="nav-container">
      <a class="nav-link" href="page_004.html">← पिछला</a>
      <a class="nav-link" href="index.html">☰ विषय-सूची</a>
      <div class="page-jump-container">
        <span>पृष्ठ</span>
        <input 
          type="number" 
          class="page-input" 
          value="5" 
          min="2" 
          max="101" 
          title="पृष्ठ संख्या लिखकर Enter दबाएँ"
          onkeydown="if(event.key === 'Enter') jumpToPage(this);" 
          onchange="jumpToPage(this);"
        />
        <span>/ 101</span>
      </div>
      <a class="nav-link" href="page_006.html">अगला →</a>
    </div>
  </header>

  <main class="page-container">
    
    <article class="page-sheet">
      <div class="content-area">
        <div class="page-number">३</div>
        <h2 class="section-heading" style="text-align: center;">इंतिसाब</h2><div class="prose-block cols-1"><p>दादा जी !</p><p>आप का कलाम आप की ज़िंदगी में छप न सका।</p><p>आप की</p><p>शायरी मगर ख़ुशबू की तरह फैलती रही।</p><p>यह मजमुआ</p><p>मैं आप के नाम नज़्र कर रहा हूँ।</p><p>(रवी)</p></div>
      </div>
      
    </article>
    
  </main>
</body>
</html>
