<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ऐसी बावरचन की उल्फ़त जाए चूल्हे भाड़ में - कलाम-ए-बेढब</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function jumpToPage(inputElement) {
      let val = parseInt(inputElement.value, 10);
      if (!isNaN(val) && val >= 2 && val <= 101) {
        let formatted = String(val).padStart(3, '0');
        window.location.href = "page_" + formatted + ".html";
      } else {
        inputElement.value = 85;
      }
    }
  </script>
</head>
<body>
  <header class="book-nav">
    <div class="nav-container">
      <a class="nav-link" href="page_084.html">← पिछला</a>
      <a class="nav-link" href="index.html">☰ विषय-सूची</a>
      <div class="page-jump-container">
        <span>पृष्ठ</span>
        <input 
          type="number" 
          class="page-input" 
          value="85" 
          min="2" 
          max="101" 
          title="पृष्ठ संख्या लिखकर Enter दबाएँ"
          onkeydown="if(event.key === 'Enter') jumpToPage(this);" 
          onchange="jumpToPage(this);"
        />
        <span>/ 101</span>
      </div>
      <a class="nav-link" href="page_086.html">अगला →</a>
    </div>
  </header>

  <main class="page-container">
    
    <article class="page-sheet">
      <div class="content-area">
        <div class="page-number">८१</div>
        <div class="couplet-group"><div class="couplet"><div class="misra left">ऐसी बावरचन की उल्फ़त जाए चूल्हे भाड़ में</div><div class="misra right">दिल मेरा चावल की सूरत जिस ने बरियाँ कर दिया</div></div><div class="couplet"><div class="misra left">ज़ायक़ा चटनी का लेना था उन्हें अशआर में</div><div class="misra right">हज़रत-ए-बेढब को बुलवा कर ग़ज़ल-ख़्वाँ कर दिया</div></div></div><hr class="divider">
      </div>
      
    </article>
    
  </main>
</body>
</html>
